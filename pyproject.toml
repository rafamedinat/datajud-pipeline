[project]
name = "datajud-pipeline"
version = "0.1.0"
description = "Pipeline de dados e ML sobre processos judiciais públicos (API DataJud/CNJ)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
datajud = "datajud_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datajud_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
